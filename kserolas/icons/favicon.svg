    <circle cx="512" cy="512" r="330" stroke="#14B86A" stroke-dasharray="315.6 1757.9" stroke-dashoffset="-360.6"/>
    <circle cx="512" cy="512" r="330" stroke="#F2B705" stroke-dasharray="315.6 1757.9" stroke-dashoffset="-706.2"/>
    <circle cx="512" cy="512" r="330" stroke="#FF8A1F" stroke-dasharray="315.6 1757.9" stroke-dashoffset="-1051.8"/>
    <circle cx="512" cy="512" r="330" stroke="#EF3E4A" stroke-dasharray="315.6 1757.9" stroke-dashoffset="-1397.4"/>
    <circle cx="512" cy="512" r="330" stroke="#E64FB0" stroke-dasharray="315.6 1757.9" stroke-dashoffset="-1743"/>
  </g>
  <!-- Owl (120 unit grid scaled x3.6, centred) -->
  <g transform="translate(296 296) scale(3.6)">
    <path d="M22 34 L30 10 L50 25 Q60 22 70 25 L90 10 L98 34 Q107 54 102 76 Q95 102 60 114 Q25 102 18 76 Q13 54 22 34 Z" fill="#14B8C8" stroke="#0A0820" stroke-width="5" stroke-linejoin="round"/>
