<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Xerolas app icon concept: owl inside the six-category ring</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2170"/>
      <stop offset=".6" stop-color="#15123A"/>
      <stop offset="1" stop-color="#0D3B4A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".46" r=".5">
      <stop offset="0" stop-color="#14B8C8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#14B8C8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="420" fill="url(#glow)"/>
  <!-- Six category segments: r=330, circumference 2073.5, segment 345.6, gap 30 -->
  <g fill="none" stroke-width="76" transform="rotate(-90 512 512)">
